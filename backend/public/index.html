<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vynx — Talk close. Watch wide.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="auth-wrap" style="padding-top:100px;">
    <div class="wordmark">Vynx</div>
    <div class="tag">Talk close. Watch wide.</div>
    <a href="register.html" class="btn btn-primary btn-block" style="margin-bottom:12px;">Create account</a>
    <a href="login.html" class="btn btn-secondary btn-block">I already have an account</a>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/api.js"></script>
<script>
  // If already logged in, skip straight to the feed.
  Api.ready().then((firebaseUser) => {
    if (firebaseUser) window.location.href = 'feed.html';
  });
</script>
</body>
</html>
