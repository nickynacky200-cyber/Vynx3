<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Vynx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vynx">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>
<div class="app-shell">
  <div class="auth-wrap">
    <div class="wordmark">Vynx</div>
    <div class="tag">Welcome back</div>

    <div id="alertBox"></div>

    <button type="button" class="btn-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.9 6.1 29.7 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.9 6.1 29.7 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.6 0 10.7-2.1 14.5-5.7l-6.7-5.5C29.6 34.6 26.9 35.5 24 35.5c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.7 5.5C39.8 37.4 44 31.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <div class="auth-divider">or</div>

    <form id="loginForm">
      <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password">
      </div>
      <div style="text-align:right; margin: -10px 0 16px;">
        <a href="#" id="forgotLink" class="mono muted" style="font-size:0.72rem;">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log in</button>
    </form>

    <div id="resetForm" class="hidden">
      <div class="field"><label for="resetEmail">Email</label><input id="resetEmail" type="email" required autocomplete="email"></div>
      <button type="button" class="btn btn-primary btn-block" id="resetSubmitBtn">Send reset link</button>
      <div style="text-align:center; margin-top:14px;">
        <a href="#" id="backToLoginLink" class="mono muted" style="font-size:0.78rem;">Back to log in</a>
      </div>
    </div>

    <div class="auth-switch">New here? <a href="register.html">Create an account</a></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/pwa.js"></script>
<script>
// Friendlier copy for Firebase's error codes than its raw messages.
function firebaseAuthErrorMessage(err) {
  switch (err.code) {
    case 'auth/invalid-email':
    case 'auth/invalid-credential':
    case 'auth/wrong-password':
    case 'auth/user-not-found':
      return 'Incorrect email or password.';
    case 'auth/too-many-requests':
      return 'Too many attempts. Please wait a bit and try again.';
    case 'auth/network-request-failed':
      return 'Network error. Check your connection and try again.';
    default:
      return err.message || 'Something went wrong. Please try again.';
  }
}

const loginForm = document.getElementById('loginForm');
const resetForm = document.getElementById('resetForm');
const alertBox = document.getElementById('alertBox');

document.getElementById('forgotLink').addEventListener('click', (e) => {
  e.preventDefault();
  alertBox.innerHTML = '';
  document.getElementById('resetEmail').value = document.getElementById('email').value.trim();
  loginForm.classList.add('hidden');
  resetForm.classList.remove('hidden');
});

document.getElementById('backToLoginLink').addEventListener('click', (e) => {
  e.preventDefault();
  alertBox.innerHTML = '';
  resetForm.classList.add('hidden');
  loginForm.classList.remove('hidden');
});

document.getElementById('resetSubmitBtn').addEventListener('click', async () => {
  const email = document.getElementById('resetEmail').value.trim();
  if (!email) return;
  const btn = document.getElementById('resetSubmitBtn');
  alertBox.innerHTML = '';
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    await auth.sendPasswordResetEmail(email);
    // Deliberately the same message whether or not the email exists — a
    // different message per case would let someone probe for which
    // emails are registered on Vynx.
    alertBox.innerHTML = '<div class="alert alert-success">If that email has a Vynx account, a reset link is on its way.</div>';
  } catch (err) {
    if (err.code === 'auth/invalid-email') {
      alertBox.innerHTML = '<div class="alert alert-error">Please enter a valid email address.</div>';
    } else {
      alertBox.innerHTML = '<div class="alert alert-success">If that email has a Vynx account, a reset link is on its way.</div>';
    }
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send reset link';
  }
});

document.getElementById('googleBtn').addEventListener('click', async () => {
  alertBox.innerHTML = '';
  try {
    await Api.signInWithGoogle();
    try {
      const data = await Api.call('/auth/sync', { method: 'POST' });
      Api.setProfile(data.user);
      window.location.href = 'feed.html';
    } catch (syncErr) {
      if (syncErr.needsProfile) {
        const { fullName, handle } = await Api.promptFinishGoogleProfile(syncErr.suggestedFullName);
        const data = await Api.call('/auth/sync', { method: 'POST', body: { fullName, handle } });
        Api.setProfile(data.user);
        window.location.href = 'feed.html';
      } else {
        throw syncErr;
      }
    }
  } catch (err) {
    if (err.code === 'auth/popup-closed-by-user') return; // they just cancelled — no error needed
    alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
});

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  alertBox.innerHTML = '';
  btn.disabled = true;
  btn.textContent = 'Logging in…';

  try {
    await auth.signInWithEmailAndPassword(
      document.getElementById('email').value.trim(),
      document.getElementById('password').value
    );
    // Pull (or, for accounts that pre-date this profile row, create) the
    // local profile — handle, bio, avatar color — tied to this Firebase user.
    const data = await Api.call('/auth/sync', { method: 'POST' });
    Api.setProfile(data.user);
    window.location.href = 'feed.html';
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-error">${firebaseAuthErrorMessage(err)}</div>`;
    btn.disabled = false;
    btn.textContent = 'Log in';
  }
});
</script>
</body>
</html>
