<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account — Vynx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vynx">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>
<div class="app-shell">
  <div class="auth-wrap">
    <div class="wordmark">Vynx</div>
    <div class="tag">Create your account</div>

    <div id="alertBox"></div>

    <button type="button" class="btn-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.9 6.1 29.7 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.9 6.1 29.7 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.6 0 10.7-2.1 14.5-5.7l-6.7-5.5C29.6 34.6 26.9 35.5 24 35.5c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.7 5.5C39.8 37.4 44 31.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <div class="auth-divider">or</div>

    <form id="registerForm">
      <div class="field"><label for="fullName">Full name</label><input id="fullName" required autocomplete="name"></div>
      <div class="field"><label for="handle">Handle</label><input id="handle" required placeholder="e.g. kemijide" autocomplete="username"></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="6" autocomplete="new-password"></div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
    </form>

    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/pwa.js"></script>
<script>
// Friendlier copy for Firebase's error codes than its raw messages.
function firebaseAuthErrorMessage(err) {
  switch (err.code) {
    case 'auth/email-already-in-use':
      return 'That email is already registered — try logging in instead.';
    case 'auth/invalid-email':
      return 'Please enter a valid email address.';
    case 'auth/weak-password':
      return 'Password must be at least 6 characters.';
    case 'auth/network-request-failed':
      return 'Network error. Check your connection and try again.';
    default:
      return err.message || 'Something went wrong. Please try again.';
  }
}

const alertBox = document.getElementById('alertBox');

document.getElementById('googleBtn').addEventListener('click', async () => {
  alertBox.innerHTML = '';
  try {
    await Api.signInWithGoogle();
    try {
      const data = await Api.call('/auth/sync', { method: 'POST' });
      Api.setProfile(data.user);
      window.location.href = 'feed.html';
    } catch (syncErr) {
      if (syncErr.needsProfile) {
        const { fullName, handle } = await Api.promptFinishGoogleProfile(syncErr.suggestedFullName);
        const data = await Api.call('/auth/sync', { method: 'POST', body: { fullName, handle } });
        Api.setProfile(data.user);
        window.location.href = 'feed.html';
      } else {
        throw syncErr;
      }
    }
  } catch (err) {
    if (err.code === 'auth/popup-closed-by-user') return;
    alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
});

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  alertBox.innerHTML = '';
  btn.disabled = true;
  btn.textContent = 'Creating account…';

  const fullName = document.getElementById('fullName').value.trim();
  const handle = document.getElementById('handle').value.trim();
  let createdFirebaseUser = false;

  try {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    await auth.createUserWithEmailAndPassword(email, password);
    createdFirebaseUser = true;
    await auth.currentUser.updateProfile({ displayName: fullName });

    // Creates the local profile row (handle, bio, avatar color) tied to
    // this new Firebase user.
    const data = await Api.call('/auth/sync', { method: 'POST', body: { fullName, handle } });
    Api.setProfile(data.user);
    window.location.href = 'feed.html';
  } catch (err) {
    // If the handle was taken (or any other backend validation failed)
    // after Firebase already created the account, remove the orphaned
    // Firebase user so the person can try again with the same email.
    if (createdFirebaseUser && auth.currentUser) {
      await auth.currentUser.delete().catch(() => {});
    }
    alertBox.innerHTML = `<div class="alert alert-error">${firebaseAuthErrorMessage(err)}</div>`;
    btn.disabled = false;
    btn.textContent = 'Create account';
  }
});
</script>
</body>
</html>
